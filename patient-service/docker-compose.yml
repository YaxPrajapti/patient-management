version: '3.8'

services:
  patient-service-db:
    image: postgres:latest
    container_name: patient-service-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
    volumes:
      - ../../db/patient-service:/var/lib/postgresql/data
#      - /Users/yaxprajapati/Developer/Spring/microservices/db/patient-service:/var/lib/postgresql/data
    networks:
      - internal

  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patient-service
    depends_on:
      - patient-service-db
    ports:
      - "4000:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    networks:
      - internal

networks:
  internal:
    driver: bridge
